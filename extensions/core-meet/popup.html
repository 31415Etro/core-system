<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>CORE Meet</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="top">
      <img src="icons/icon32.png" alt="" width="24" height="24" />
      <span class="brand">CORE <b>Meet</b></span>
      <span id="conn" class="conn" hidden></span>
    </header>

    <main id="app" aria-live="polite">
      <div class="loading"><span class="spinner"></span></div>
    </main>

    <template id="tpl-setup">
      <section class="card">
        <h1>Conectar à CORE</h1>
        <p class="muted">Gere um token em <b>CORE → Reuniões → Conectar extensão</b> e cole abaixo.</p>
        <label class="field">Endereço da CORE<input id="baseUrl" type="url" placeholder="https://infra.coresystems.company" autocomplete="url" /></label>
        <label class="field">Token da extensão<input id="token" type="password" placeholder="cmeet_..." autocomplete="off" /></label>
        <p id="setupError" class="error" hidden></p>
        <button id="connectBtn" class="btn primary">Conectar</button>
      </section>
    </template>

    <template id="tpl-not-meet">
      <section class="card center">
        <div class="big-icon">🎥</div>
        <h1>Abra uma reunião do Google Meet</h1>
        <p class="muted">Entre na chamada em <b>meet.google.com</b> e clique na CORE Meet de novo para gravar.</p>
      </section>
    </template>

    <template id="tpl-ready">
      <section class="card">
        <h1>Nova gravação</h1>
        <div class="seg" role="radiogroup" aria-label="Tipo de reunião">
          <button data-type="interna" role="radio" aria-checked="true" title="Reunião interna da equipe">Equipe</button>
          <button data-type="cliente" role="radio" aria-checked="false">Cliente</button>
          <button data-type="lead" role="radio" aria-checked="false">Lead</button>
        </div>

        <div id="pickerWrap" hidden>
          <label class="field"><span id="pickerLabel">Cliente</span>
            <input id="pickerSearch" type="search" placeholder="Buscar..." autocomplete="off" />
          </label>
          <ul id="pickerList" class="list" role="listbox" aria-label="Opções"></ul>
        </div>

        <label class="field">Título (opcional)<input id="title" type="text" placeholder="A IA sugere um título se ficar vazio" maxlength="160" /></label>

        <div id="micRow" class="row-info"></div>
        <label class="toggle" for="videoToggle">
          <span><b>Gravar vídeo da reunião</b><small>Imagem da aba do Meet, salva em Reuniões (~360 MB por hora)</small></span>
          <input id="videoToggle" type="checkbox" role="switch" />
        </label>
        <p class="hint">Grava <b>seu microfone</b> e o <b>som da reunião</b> em faixas separadas (e o vídeo, se ativado). Ao finalizar, o áudio é transcrito de graça e a IA escreve a ata. Use fone de ouvido para um áudio mais limpo.</p>
        <p id="readyError" class="error" hidden></p>
        <button id="startBtn" class="btn primary"><span class="dot"></span>Iniciar gravação</button>
      </section>
    </template>

    <template id="tpl-recording">
      <section class="card">
        <div class="rec-head">
          <span id="recDot" class="rec-dot"></span>
          <span id="recLabel" class="rec-label">Gravando</span>
        </div>
        <div id="timer" class="timer">00:00:00</div>
        <p id="recTitle" class="rec-title"></p>
        <p id="recLinked" class="muted small"></p>
        <p id="recInfo" class="muted small"></p>
        <p id="recWarn" class="warn" hidden></p>
        <div class="actions">
          <button id="pauseBtn" class="btn">Pausar</button>
          <button id="stopBtn" class="btn danger">Finalizar</button>
        </div>
      </section>
    </template>

    <template id="tpl-sending">
      <section class="card center">
        <span class="spinner big"></span>
        <h1>Enviando para a CORE…</h1>
        <p class="muted">Enviando as últimas partes do áudio e do vídeo. Pode fechar esta janela — o envio continua.</p>
      </section>
    </template>

    <template id="tpl-done">
      <section class="card center">
        <div class="big-icon ok">✓</div>
        <h1>Reunião enviada</h1>
        <p class="muted">A CORE está transcrevendo o áudio e, em seguida, a IA escreve a ata, as tarefas e as pendências.</p>
        <p id="doneWarn" class="warn" hidden></p>
        <button id="openBtn" class="btn primary">Abrir na CORE</button>
        <button id="newBtn" class="btn ghost">Nova gravação</button>
      </section>
    </template>

    <footer id="footer" class="foot" hidden>
      <span id="who"></span>
      <button id="disconnectBtn" class="link">Desconectar</button>
    </footer>

    <script src="popup.js" type="module"></script>
  </body>
</html>
